server:
  port: 8080

spring:
  application:
    name: "crediya-solicitudes-msc"
  devtools:
    add-properties: false

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

# --- BLOQUE DE CONFIGURACIÓN UNIFICADO Y CORREGIDO ---
# Usamos 'adapter' en singular para que coincida con el @Value
adapters:
  r2dbc:
    # Lee las variables de entorno de docker-compose, con valores por defecto para correr localmente
    host: "${ADAPTERS_R2DBC_HOST:localhost}"
    port: 5433 # El puerto que exponemos en el host para la BD de solicitudes
    database: "${ADAPTERS_R2DBC_DATABASE:crediya_solicitudes_db}"
    schema: "public"
    username: "${ADAPTERS_R2DBC_USERNAME:user}"
    password: "${ADAPTERS_R2DBC_PASSWORD:password}"
  restconsumer:
    timeout: 5000
    # Lee la URL del servicio de autenticación desde la variable de entorno
    url: "${ADAPTER_RESTCONSUMER_URL:http://localhost:8081}"

# --- BLOQUE DE RESILIENCE4J CORREGIDO ---
resilience4j:
  circuitbreaker:
    instances:
      # El nombre aquí debe coincidir con el usado en la anotación @CircuitBreaker
      autenticacionService:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"